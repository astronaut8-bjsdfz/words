<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070d14">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Week 10 单词雪球：看中文写英文，逐题判对错，错词自动收进错词本反复练。">
<title>单词雪球 · Week 10</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23dfeef7'/%3E%3Ccircle cx='11' cy='11' r='4' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css?v=20261105f">
</head>
<body>

<div class="app">

  <header class="bar">
    <!-- 三页都挂这个键：做题＝「结束这一轮，看结算」，首页与结算＝「回门户」。
         回门户是真链接 <a href="../">，手机浏览器能记住来路，按返回还能回来 -->
    <a class="back" id="btnBack" href="../" aria-label="回门户">
      <span class="arw" aria-hidden="true">←</span><span class="tx" id="backTx">门户</span>
    </a>
    <span class="tag">WK10</span>
    <span class="brand">单词雪球</span>
    <span class="grow"></span>
    <span class="mini" id="barMini">242</span>
  </header>

  <main>

    <!-- ========== 首页 ========== -->
    <section class="view" id="vHome">
      <div class="hero">
        <div class="orb" aria-hidden="true"><i></i></div>
        <div class="hero-txt">
          <h1>Week 10</h1>
          <p class="lede">看中文，写出英文。<br>判完自动收错词，下一轮只练错的。</p>
        </div>
      </div>

      <div class="stats">
        <div class="st"><b id="stDone">0</b><span>已练</span></div>
        <div class="st"><b id="stAcc">—</b><span>正确率</span></div>
        <div class="st"><b id="stWrong">0</b><span>错词本</span></div>
      </div>

      <div class="modes" id="homeModes">
        <button class="btn primary" type="button" data-go="all">
          <span>全部练一轮</span><i id="allN">242</i>
        </button>
        <button class="btn" type="button" data-go="wrong" id="btnWrongMode">
          <span>只练错词</span><i id="wrongN">0</i>
        </button>
      </div>

      <div class="sec">
        <h2>按页练<span>PPT 原页序</span></h2>
        <div class="pages" id="pages"></div>
      </div>

      <p class="foot">词条取自《week 10 单词雪球 11.5》PPT，共 242 条。答对/答错只存在这台设备的浏览器里。<span class="ver" id="ver"></span></p>
    </section>

    <!-- ========== 做题 ========== -->
    <section class="view" id="vQuiz" hidden>
      <div class="qbar">
        <span class="qi" id="qi">1 / 242</span>
        <div class="pbar"><i id="pfill"></i></div>
        <span class="qe" id="qe">错 0</span>
      </div>

      <div class="qcard">
        <p class="qpos" id="qpos"></p>
        <p class="qzh" id="qzh"></p>

        <div class="ansrow">
          <input id="ans" type="text" autocomplete="off" autocapitalize="off"
                 autocorrect="off" spellcheck="false" enterkeyhint="done"
                 placeholder="写下英文…" aria-label="英文答案">
          <button class="speak" type="button" id="btnSpeak" aria-label="朗读答案" hidden>🔊</button>
        </div>
        <p class="anshint" id="ansHint">写完按回车判定</p>

        <div class="fb" id="fb" hidden></div>
      </div>

      <div class="keys" id="keys">
        <button class="btn small" type="button" id="btnHint">提示首字母</button>
        <button class="btn small" type="button" id="btnShow">看答案</button>
        <button class="btn small ghost" type="button" id="btnSkip">跳过</button>
        <button class="btn small next" type="button" id="btnNext" hidden>下一题</button>
      </div>
    </section>

    <!-- ========== 结算 ========== -->
    <section class="view" id="vDone" hidden>
      <div class="done-head">
        <div class="ring" id="ring"><span id="rPct">0%</span></div>
        <div class="done-txt">
          <h2 id="rTitle">—</h2>
          <p id="rSub">—</p>
        </div>
      </div>

      <div class="sec" id="rWrongSec">
        <h2>这轮错的<span id="rWrongN">0 个</span></h2>
        <div class="wlist" id="rWrong"></div>
      </div>

      <div class="modes">
        <button class="btn primary" type="button" id="rRetry" hidden>
          <span>重练这些</span><i id="rRetryN">0</i>
        </button>
        <button class="btn" type="button" id="rAgain">整轮再来</button>
        <button class="btn ghost" type="button" id="rHome">回首页</button>
      </div>
    </section>

  </main>
</div>

<script src="./data.js?v=20261105f"></script>
<script src="./app.js?v=20261105f"></script>
</body>
</html>
